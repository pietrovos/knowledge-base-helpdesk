name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: supportlens
          POSTGRES_PASSWORD: supportlens
          POSTGRES_DB: supportlens
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U supportlens" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      # Every provider is faked in CI: no network calls to model or embedding APIs.
      EMBEDDING_PROVIDER: fake
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=supportlens -e MINIO_ROOT_PASSWORD=supportlens-secret \
            cgr.dev/chainguard/minio:latest server /data
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: uv sync --frozen
      - name: Lint
        working-directory: backend
        run: uv run ruff check .
      - name: Test
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=term-missing:skip-covered
      - name: Eval regression gate (offline fakes)
        working-directory: backend
        run: uv run python -m evals.run --embedder fake --llm fake --gate --out eval-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: backend/eval-report

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
