# Production-like stack on one host, using the production images.
#   docker compose -f docker-compose.prod.yml up -d --build
# Requires JWT_SECRET (32+ random chars). Exposes the app on http://localhost:8080.
name: supportlens-prod

x-env: &env
  ENV: prod
  DATABASE_URL: postgresql+psycopg://supportlens:${POSTGRES_PASSWORD:-supportlens}@db:5432/supportlens
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
  S3_ACCESS_KEY: supportlens
  S3_SECRET_KEY: ${MINIO_PASSWORD:-supportlens-secret}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  db:
    image: pgvector/pgvector:pg17
    environment: {POSTGRES_USER: supportlens, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-supportlens}", POSTGRES_DB: supportlens}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U supportlens"], interval: 2s, retries: 30}
  redis:
    image: redis:7-alpine
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data"]
    environment: {MINIO_ROOT_USER: supportlens, MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:-supportlens-secret}"}
    ports: ["${MINIO_PORT:-9000}:9000"]
    volumes: [miniodata:/data]
  migrate:
    build: {context: ./backend, dockerfile: Dockerfile.prod}
    image: supportlens-api:prod
    environment: *env
    command: sh -c "alembic upgrade head && python -m app.cli init-storage"
    depends_on: {db: {condition: service_healthy}, minio: {condition: service_started}}
  api:
    image: supportlens-api:prod
    environment: *env
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_started}}
  worker:
    image: supportlens-api:prod
    environment: *env
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=2
    depends_on: {migrate: {condition: service_completed_successfully}}
  web:
    build: ./frontend
    ports: ["${WEB_PORT:-8080}:8080"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
