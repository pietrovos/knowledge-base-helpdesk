name: supportlens

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://supportlens:supportlens@db:5432/supportlens
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  S3_ACCESS_KEY: supportlens
  S3_SECRET_KEY: supportlens-secret
  S3_BUCKET: supportlens-docs
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  FAKE_LLM_MODE: ${FAKE_LLM_MODE:-ok}
  JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-in-prod}
  HF_HOME: /models
  FASTEMBED_CACHE_PATH: /models/fastembed

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: supportlens
      POSTGRES_PASSWORD: supportlens
      POSTGRES_DB: supportlens
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportlens"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  minio:
    # MinIO no longer publishes official images; Chainguard maintains a current build.
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: supportlens
      MINIO_ROOT_PASSWORD: supportlens-secret
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build: ./backend
    environment: *backend-env
    command: sh -c "alembic upgrade head && python -m app.cli init-storage && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports: ["8000:8000"]
    volumes: [./backend:/app, models:/models]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      retries: 40

  worker:
    build: ./backend
    environment: *backend-env
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=2
    volumes: [./backend:/app, models:/models]
    depends_on:
      api: {condition: service_healthy}

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: ["5173:5173"]
    volumes: [./frontend:/app, web_node_modules:/app/node_modules]
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
  miniodata:
  models:
  web_node_modules:
